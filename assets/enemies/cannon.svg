<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 대포병 — 정지해서 빠르게 연사하는 중화기. 다른 적보다 땅딸막하고 두꺼운 팔각 포탑 + 쌍포신 + 고정 다리 -->
  <defs>
    <linearGradient id="rock" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#352a1c"/><stop offset="55%" stop-color="#1c160e"/><stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff0c8"/><stop offset="35%" stop-color="#e8a33d"/><stop offset="75%" stop-color="#b36a14"/><stop offset="100%" stop-color="#4a2a08"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="b"/><feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="110" cy="100" rx="78" ry="48" fill="#e8a33d" opacity="0.32" filter="url(#halo)"/>
  <!-- 쌍포신 -->
  <rect x="134" y="70" width="60" height="17" rx="3" fill="url(#rock)" stroke="#000" stroke-opacity="0.4"/>
  <rect x="134" y="113" width="60" height="17" rx="3" fill="url(#rock)" stroke="#000" stroke-opacity="0.4"/>
  <g fill="#b36a14" opacity="0.75">
    <rect x="184" y="68" width="9" height="21" rx="2"/>
    <rect x="184" y="111" width="9" height="21" rx="2"/>
  </g>
  <g fill="#fff0c8" opacity="0.85" filter="url(#glow)">
    <circle cx="193" cy="78.5" r="3.5"/>
    <circle cx="193" cy="121.5" r="3.5"/>
  </g>
  <!-- 팔각 포탑 몸체 -->
  <polygon points="95,54 129,68 145,100 129,132 95,146 61,132 45,100 61,68"
    fill="url(#rock)" stroke="#000" stroke-opacity="0.45"/>
  <!-- 표면 결 -->
  <path d="M61,68 L95,84 L129,68" fill="none" stroke="#000" stroke-width="1.3" opacity="0.35"/>
  <path d="M61,132 L95,116 L129,132" fill="none" stroke="#000" stroke-width="1.3" opacity="0.35"/>
  <!-- 장갑 리벳 -->
  <g fill="#0a0806">
    <circle cx="95" cy="54" r="3"/><circle cx="129" cy="68" r="3"/><circle cx="145" cy="100" r="3"/>
    <circle cx="129" cy="132" r="3"/><circle cx="95" cy="146" r="3"/><circle cx="61" cy="132" r="3"/>
    <circle cx="45" cy="100" r="3"/><circle cx="61" cy="68" r="3"/>
  </g>
  <!-- 장약고(코어) -->
  <circle cx="95" cy="100" r="32" fill="url(#gem)"/>
  <circle cx="95" cy="100" r="32" fill="none" stroke="#5c3a0c" stroke-width="2" opacity="0.7"/>
  <circle cx="95" cy="100" r="20" fill="none" stroke="#fff0c8" stroke-width="1.4" opacity="0.4" stroke-dasharray="3,6"/>
  <ellipse cx="86" cy="90" rx="9" ry="6" fill="#fff6e6" opacity="0.4"/>
</svg>
