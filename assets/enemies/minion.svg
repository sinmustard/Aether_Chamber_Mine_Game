<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 잡졸 — 같은 암석+발광 코어 기법의 가장 단순한 버전(1칸짜리 최하급) -->
  <defs>
    <linearGradient id="rock" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#332a30"/><stop offset="55%" stop-color="#1c1418"/><stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="gem" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffd9b0"/><stop offset="45%" stop-color="#ff6a52"/><stop offset="100%" stop-color="#3a0d12"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="26" fill="#ff3b52" opacity="0.55" filter="url(#halo)"/>
  <polygon points="100,45 145,100 100,155 55,100" fill="url(#rock)" stroke="#000" stroke-opacity="0.4"/>
  <polygon points="100,68 122,100 100,132 78,100" fill="url(#gem)"/>
  <polygon points="100,68 122,100 100,132 78,100" fill="none" stroke="#3a0d12" stroke-width="1.5" opacity="0.7"/>
</svg>
