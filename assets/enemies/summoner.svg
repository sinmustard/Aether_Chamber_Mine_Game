<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 소환사 — 쏘지 않고 잡졸·분열형을 불러낸다. 중심 코어 + 주변을 도는 위성 3개 -->
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f0d9ff"/>
      <stop offset="40%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#2a1040"/>
    </radialGradient>
    <radialGradient id="sat" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0d9ff"/>
      <stop offset="60%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#5a2a8a"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#b06bff" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.5"/>
  <circle cx="100" cy="100" r="48" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#2a1040" stroke-width="2" opacity="0.8"/>
  <circle cx="100" cy="26" r="14" fill="url(#sat)" filter="url(#glow)"/>
  <circle cx="163" cy="138" r="14" fill="url(#sat)" filter="url(#glow)"/>
  <circle cx="37" cy="138" r="14" fill="url(#sat)" filter="url(#glow)"/>
</svg>
