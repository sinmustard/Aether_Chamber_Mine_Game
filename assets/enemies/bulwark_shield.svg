<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    v2.3 — 크리스탈 판 대신 에너지 실드(역장) 컨셉으로 다시 제작한 임시 플레이스홀더.
    본체 중심(피벗)이 이 뷰박스의 정중앙(100,100)과 겹치도록 그렸다.
    기준 방향은 오른쪽(0rad, 각도 0° = x+ 방향)이 정면(막는 면)이고,
    코드에서 facing만큼 통째로 회전시켜 쓴다 (index.html drawShield).
    좌우 대칭·중심 정렬이라 어느 각도로 돌려도 길쭉해 보이지 않는다.
  -->
  <defs>
    <radialGradient id="field" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffe4d6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ff3b52" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2f0c10" stop-opacity="0.12"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 역장 판 (부채꼴 링 조각, ~100도) -->
  <path d="M159.1,29.5 A92,92 0 0 1 159.1,170.5 L136,142.9 A56,56 0 0 0 136,57.1 Z"
        fill="url(#field)"/>

  <!-- 패널 분할선(육각 HUD 느낌) -->
  <g stroke="#ff3b52" stroke-width="1.4" opacity="0.55">
    <line x1="156" y1="100" x2="192" y2="100"/>
    <line x1="150.8" y1="123.7" x2="183.4" y2="138.9"/>
    <line x1="150.8" y1="76.3" x2="183.4" y2="61.1"/>
  </g>

  <!-- 정면(막는 면) 바깥 테두리 — 밝게 강조, 발광 -->
  <path d="M159.1,29.5 A92,92 0 0 1 159.1,170.5"
        fill="none" stroke="#ffe4d6" stroke-width="4" stroke-linecap="round"
        opacity="0.95" filter="url(#glow)"/>
  <path d="M159.1,29.5 A92,92 0 0 1 159.1,170.5"
        fill="none" stroke="#ff3b52" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
</svg>
