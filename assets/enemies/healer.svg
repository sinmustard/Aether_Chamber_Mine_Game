<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 힐러 — 같은 암석+발광 코어 기법. 공격형과 달리 뾰족한 가시 없이 둥근 암석 + 십자 코어(빨강) -->
  <defs>
    <linearGradient id="rock" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#332a30"/><stop offset="55%" stop-color="#1c1418"/><stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="gem" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffd9b0"/><stop offset="35%" stop-color="#ff8a63"/><stop offset="75%" stop-color="#ff3b52"/><stop offset="100%" stop-color="#8f1424"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="42" fill="#ff3b52" opacity="0.5" filter="url(#halo)"/>
  <circle cx="100" cy="100" r="70" fill="url(#rock)" stroke="#000" stroke-opacity="0.4"/>
  <circle cx="100" cy="100" r="46" fill="url(#gem)"/>
  <circle cx="100" cy="100" r="46" fill="none" stroke="#3a0d12" stroke-width="2" opacity="0.7"/>
  <ellipse cx="86" cy="86" rx="16" ry="9" fill="#ffe6c8" opacity="0.4"/>
  <g fill="#ffd9b0" opacity="0.95">
    <rect x="90" y="66" width="20" height="68" rx="6"/>
    <rect x="66" y="90" width="68" height="20" rx="6"/>
  </g>
</svg>
