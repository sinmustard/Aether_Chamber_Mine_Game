<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 잡몹 — 가장 기본형. 다른 적 이미지들과 같은 벡터 스타일로 통일. 6각 별, 장식 없음 -->
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffd9b0"/>
      <stop offset="40%" stop-color="#ff6a52"/>
      <stop offset="100%" stop-color="#3a0d12"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="100,20 119,67 170,60 138,100 170,140 119,133 100,180 81,133 30,140 62,100 30,60 81,67"
    fill="url(#core)" filter="url(#glow)"/>
  <polygon points="100,20 119,67 170,60 138,100 170,140 119,133 100,180 81,133 30,140 62,100 30,60 81,67"
    fill="none" stroke="#2a0810" stroke-width="2" opacity="0.75"/>
</svg>
