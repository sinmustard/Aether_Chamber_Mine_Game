<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 송신기 — 쏘지 않는 지원형. 안테나 + 신호파. 무기(포신) 없음 -->
  <defs>
    <radialGradient id="core" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="40%" stop-color="#ffcc55"/>
      <stop offset="100%" stop-color="#5c4a10"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#ffcc55" opacity="0.35">
    <circle cx="100" cy="110" r="55"/>
    <circle cx="100" cy="110" r="78"/>
  </g>
  <polygon points="100,20 108,95 92,95" fill="#3a2f08"/>
  <polygon points="60,60 96,100 88,108" fill="#3a2f08"/>
  <polygon points="140,60 104,100 112,108" fill="#3a2f08"/>
  <circle cx="100" cy="120" r="34" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="100" cy="120" r="34" fill="none" stroke="#2a1f06" stroke-width="2"/>
</svg>
