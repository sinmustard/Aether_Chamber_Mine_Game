<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 분열형 — 같은 암석+발광 코어 기법. 좌우 대칭 암석 두 덩이 + 갈라진 발광 이음선 -->
  <defs>
    <linearGradient id="rockL" x1="70%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#332a30"/><stop offset="55%" stop-color="#1c1418"/><stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <linearGradient id="rockR" x1="30%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#332a30"/><stop offset="55%" stop-color="#1c1418"/><stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="crackGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="100" cy="100" rx="16" ry="55" fill="#ff3b52" opacity="0.5" filter="url(#halo)"/>
  <path d="M65,100 C65,60 45,40 25,45 C10,75 10,125 25,155 C45,160 65,140 65,100 Z" fill="url(#rockL)" stroke="#000" stroke-opacity="0.4"/>
  <path d="M135,100 C135,60 155,40 175,45 C190,75 190,125 175,155 C155,160 135,140 135,100 Z" fill="url(#rockR)" stroke="#000" stroke-opacity="0.4"/>
  <path d="M40,60 L48,100 L40,140" fill="none" stroke="#ff3b52" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#crackGlow)"/>
  <path d="M160,60 L152,100 L160,140" fill="none" stroke="#ff3b52" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#crackGlow)"/>
  <line x1="100" y1="50" x2="100" y2="150" stroke="#ff6a52" stroke-width="5" stroke-linecap="round" filter="url(#crackGlow)"/>
</svg>
