<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 엘리트 — mob과 같은 암석+발광 코어 기법. 8각 가시 + 갑주 링으로 상위 개체임을 표시 -->
  <defs>
    <linearGradient id="rock" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#3a2b30"/>
      <stop offset="55%" stop-color="#1e1417"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </linearGradient>
    <radialGradient id="gem" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffe6c8"/>
      <stop offset="35%" stop-color="#ff8a63"/>
      <stop offset="70%" stop-color="#ff3b52"/>
      <stop offset="100%" stop-color="#8f1424"/>
    </radialGradient>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="crackGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#3a1216" stroke-width="9"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ff3b52" stroke-width="2" opacity="0.55"/>
  <circle cx="100" cy="100" r="44" fill="#ff3b52" opacity="0.5" filter="url(#halo)"/>
  <polygon points="100,15 116,61 160,28 139,84 185,100 139,116 160,172 116,139 100,185 84,139 40,172 61,116 15,100 61,84 40,28 84,61"
    fill="url(#rock)" stroke="#000" stroke-opacity="0.4"/>
  <g fill="none" stroke="#ff3b52" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#crackGlow)">
    <path d="M100,70 L100,20"/>
    <path d="M130,100 L178,100"/>
    <path d="M100,130 L100,180"/>
    <path d="M70,100 L22,100"/>
  </g>
  <polygon points="100,58 142,100 100,142 58,100" fill="url(#gem)"/>
  <polygon points="100,58 142,100 100,142 58,100" fill="none" stroke="#5c0e18" stroke-width="2" opacity="0.7"/>
  <polygon points="100,58 120,100 100,100 80,100" fill="#fff3e6" opacity="0.35"/>
</svg>
